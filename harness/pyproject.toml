    "uvicorn>=0.52.4",
    "websockets>=17.0.1",
    "pyserial>=3.5"
]

[tool.uv.sources]
tetra3 = { git = "https://github.com/esa/tetra3.git" }

[tool.ty]
ignore = ["astropy", "astroquery"]
