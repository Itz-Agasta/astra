[project]
name = "astra-mcp"
version = "0.1.0"
description = "MCP server for the Astra telescope control system"
# The harness requires 3.14 and this server shares its workspace and lockfile,
# so it is a 3.14 project too. uv fetches the interpreter automatically.
requires-python = ">=3.14"
dependencies = [
    "fastmcp>=3.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
astra-mcp = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
