[project]
name = "astra"
version = "0.1.0"
requires-python = ">=3.14"

[tool.uv.workspace]
members = [
    "mcp",
    "harness",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.15",
    "ty>=0.0.42",
]
